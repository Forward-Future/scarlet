[package]
name = "scarlet-desktop"
version = "0.1.4"
description = "Scarlet desktop: Single-user AI video editor (solo engine + local agent host)"
authors = ["Forward Future"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "scarlet_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
which = "7"
anyhow = "1"
log = "0.4"
hostname = "0.4"
tempfile = "3"
flate2 = "1"
sha2 = "0.10"
regex = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
