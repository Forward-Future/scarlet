name: Desktop

# Builds the Scarlet desktop app (Tauri 2) for Windows, Apple Silicon Macs and
# Intel Macs, each on its own architecture so the engine and ffmpeg are native.
# Every build is then checked for real: the bundled engine ingests and renders
# a clip, and the macOS jobs verify the packaged app’s signature.
# Protected `v*` tags publish a draft release; other runs produce unsigned check artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/desktop*.yml"
      - ".github/tests/desktop_permissions_test.rb"

concurrency:
  group: desktop-${{ github.ref }}
  # Desktop builds are long; a newer push waits for the running one instead of cancelling it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'push' || !github.ref_protected
    uses: ./.github/workflows/desktop-build.yml
    with:
      release: false

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: write
    with:
      release: true
