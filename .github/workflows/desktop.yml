name: Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      early_access_version:
        description: "Early Access numeric version, for example 0.1.4. Leave empty for a regular check build."
        required: false
        type: string
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/agent/**"
      - "apps/web/**"
      - "packages/**"
      - "skills/**"
      - "integrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop*.yml"
      - ".github/scripts/*desktop-release*"
      - ".github/scripts/sign-*-release.*"
      - ".github/workflows/ci.yml"
      - ".github/tests/desktop_permissions_test.rb"

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.number.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test release tooling
        run: |
          ruby .github/tests/desktop_permissions_test.rb
          node --test apps/desktop/scripts/release-version.test.mjs apps/desktop/scripts/verify-desktop-package.test.mjs .github/scripts/publish-desktop-release.test.mjs
      - name: Resolve the version for this commit
        id: number
        env:
          EARLY_ACCESS_VERSION: ${{ inputs.early_access_version }}
        run: |
          node apps/desktop/scripts/release-version.mjs check
          if [ -n "$EARLY_ACCESS_VERSION" ]; then
            version=$(node apps/desktop/scripts/release-version.mjs early-access "$EARLY_ACCESS_VERSION")
          else
            version=$(node apps/desktop/scripts/release-version.mjs for-commit)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/desktop-build.yml
    with:
      release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SCARLET_STABLE_RELEASES == 'true' }}
      version: ${{ needs.version.outputs.version }}
      early_access: ${{ github.event_name == 'workflow_dispatch' && inputs.early_access_version != '' }}

  publish:
    needs: [version, build, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SCARLET_STABLE_RELEASES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Each push has its own version. Only repeat attempts for that version share a lock.
    concurrency:
      group: publish-desktop-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: scarlet-desktop-*
          merge-multiple: true
          path: installers
      - name: Publish the verified macOS and Windows installers together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node .github/scripts/publish-desktop-release.mjs "$RELEASE_VERSION" installers
