name: CI

on:
  push:
    branches: [master]
  workflow_call:
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-26
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Test with the supported pinned FFmpeg builds on desktop platforms.
      - name: ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
            exit 0
          fi
          node apps/desktop/scripts/fetch-ffmpeg.mjs
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          for t in ffmpeg ffprobe; do cp apps/desktop/src-tauri/binaries/$t-*$EXT "$RUNNER_TEMP/ffmpeg/$t$EXT"; done
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

      - name: Build (the desktop package's build script is a no-op here)
        run: pnpm -r build

      - name: Test
        if: runner.os != 'Windows'
        run: pnpm -r test

      - name: Test with user-owned Windows fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./.github/scripts/use-windows-test-owner.ps1
          # Four packages' Vitest runs at once starve the 4-core Windows runner: timed tests miss their windows and
          # workers miss Vitest's 60 s progress replies ("Timeout calling onTaskUpdate"). apps/server takes ~8 min on
          # its own, so two at a time finishes in about the same wall time.
          pnpm -r --workspace-concurrency=2 test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test transcription adapter and installer
        run: python -B -m unittest discover -s integrations/transcription/crisperwhisper

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push' && runner.os != 'Linux'

      - uses: swatinem/rust-cache@v2
        if: github.event_name == 'push' && runner.os != 'Linux'
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Rust tests
        if: github.event_name == 'push' && runner.os != 'Linux'
        working-directory: apps/desktop/src-tauri
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --locked

      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm -r typecheck
