name: CI

on:
  workflow_call:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-26
            # Every PR compiles and tests the desktop shell here; pushes to main also test it on Windows.
            rust: always
          # Opening a library on Windows sets its access rules through PowerShell, so the engine's tests take
          # several times as long there as anywhere else. They get a runner of their own beside the rest.
          - name: Windows
            os: windows-latest
            part: rest
            rust: push
          - name: Windows engine
            os: windows-latest
            part: engine
    env:
      RUST_TESTS: ${{ matrix.rust == 'always' || (matrix.rust == 'push' && github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          node-version: 22
          rust: ${{ env.RUST_TESTS }}

      # Test with the supported pinned FFmpeg builds on desktop platforms.
      - name: ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
            exit 0
          fi
          node apps/desktop/scripts/fetch-ffmpeg.mjs
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          for t in ffmpeg ffprobe; do cp apps/desktop/src-tauri/binaries/$t-*$EXT "$RUNNER_TEMP/ffmpeg/$t$EXT"; done
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

      - name: Use the packaged headless browser for graphics tests
        shell: bash
        run: |
          node apps/desktop/scripts/fetch-chrome.mjs
          folder="$GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries/chrome-headless-shell"
          executable=chrome-headless-shell
          if [ "$RUNNER_OS" = Linux ]; then
            # Ubuntu grants the browser its sandbox at the path the Debian package installs.
            sudo install -d /usr/lib/Scarlet
            sudo cp -R "$folder" /usr/lib/Scarlet/
            sudo apparmor_parser -r apps/desktop/src-tauri/linux/scarlet-chrome-headless-shell.apparmor
            folder=/usr/lib/Scarlet/chrome-headless-shell
          elif [ "$RUNNER_OS" = Windows ]; then
            executable=chrome-headless-shell.exe
          fi
          echo "SCARLET_CHROME=$folder/$executable" >> "$GITHUB_ENV"

      - name: Build (the desktop package's build script is a no-op here)
        run: pnpm -r build

      - name: Test
        if: runner.os != 'Windows'
        run: pnpm -r test

      - name: Test with user-owned Windows fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./.github/scripts/use-windows-test-owner.ps1
          # Four packages' Vitest runs at once starve the 4-core Windows runner: timed tests miss their windows and
          # workers miss Vitest's 60 s progress replies ("Timeout calling onTaskUpdate"). Two at a time, and the
          # engine's own files in parallel on the other runner.
          if ("${{ matrix.part }}" -eq "engine") { pnpm --filter @scarlet/server test }
          else { pnpm -r --workspace-concurrency=2 --filter "!@scarlet/server" test }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.part != 'engine'
        with:
          python-version: '3.12'

      - name: Test transcription adapter and installer
        if: matrix.part != 'engine'
        run: python -B -m unittest discover -s integrations/transcription/crisperwhisper

      - name: Rust tests
        if: env.RUST_TESTS == 'true'
        working-directory: apps/desktop/src-tauri
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --locked

      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm -r typecheck
