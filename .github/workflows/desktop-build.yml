name: Build desktop installers

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean
      version:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    if: ${{ !inputs.release || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    environment: ${{ inputs.release && 'release' || 'desktop-build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            triple: aarch64-apple-darwin
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            triple: x86_64-apple-darwin
            arch: x86_64
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BUNDLE: apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.triple }}

      - name: Stamp the shared release version before building
        shell: bash
        run: node apps/desktop/scripts/release-version.mjs set "$RELEASE_VERSION" --tag "v$RELEASE_VERSION"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages and desktop renderer
        run: pnpm -r build

      - name: Verify Windows library permissions
        if: runner.os == 'Windows'
        run: pnpm --filter @scarlet/server exec vitest run src/services/storagePrivacy.test.ts

      # Node SEA embeds the running node binary, so this runs on the target's architecture.
      - name: Build the engine sidecar (Node SEA)
        shell: bash
        run: |
          set -euo pipefail
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          pnpm --filter @scarlet/server build:sea -- --out "$PWD/apps/desktop/src-tauri/binaries/scarlet-engine-${{ matrix.triple }}$EXT"

      - name: Check Windows engine startup before building native dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./.github/scripts/use-windows-test-owner.ps1
          node apps/desktop/scripts/smoke-engine-startup.mjs "apps/desktop/src-tauri/binaries/scarlet-engine-${{ matrix.triple }}.exe"

      - name: Prepare external media tools for the smoke test
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/fetch-ffmpeg.mjs --target "${{ matrix.triple }}"
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p "$RUNNER_TEMP/scarlet-external-tools"
          for tool in ffmpeg ffprobe; do
            mv "apps/desktop/src-tauri/binaries/$tool-${{ matrix.triple }}$EXT" "$RUNNER_TEMP/scarlet-external-tools/$tool$EXT"
          done

      # Windows also gets a Vulkan whisper-cli for the GPU, built against the SDK's headers, loader and glslc.
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Build bundled whisper.cpp runtime
        run: node apps/desktop/scripts/build-whisper.mjs

      # Windows only: sherpa-onnx built against ONNX Runtime DirectML for speaker analysis on the GPU.
      - name: Build the GPU speaker runtime
        run: node apps/desktop/scripts/build-speaker-gpu.mjs

      - name: Check binary architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for f in apps/desktop/src-tauri/binaries/*-${{ matrix.triple }}; do
            archs=$(lipo -archs "$f"); echo "$f: $archs"
            [[ " $archs " == *" ${{ matrix.arch }} "* ]] || { echo "::error::$f is $archs, expected ${{ matrix.arch }}"; exit 1; }
          done

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --target ${{ matrix.triple }}

      - name: Test local main updater
        if: runner.os == 'macOS'
        run: python3 -B apps/desktop/scripts/test_update_macos.py

      - name: Test public package verification and notices
        run: node --test apps/desktop/scripts/smoke-engine.test.mjs apps/desktop/scripts/collect-public-notices.test.mjs

      - name: Collect public installer notices
        run: node apps/desktop/scripts/collect-public-notices.mjs --target ${{ matrix.triple }}

      # Without these secrets the Mac app is signed ad hoc: it runs, but macOS asks
      # before the first launch. Store them only in the main-only release environment for a signed,
      # notarized build. Only the ones that are set are passed on, because
      # Tauri treats an empty one as set.
      - name: Apple signing secrets
        if: inputs.release && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<__SCARLET_EOF__"; echo "${!v}"; echo "__SCARLET_EOF__"; } >> "$GITHUB_ENV"; echo "$v: set"; fi
          done

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.triple }} --config src-tauri/tauri.public.conf.json

      - name: Check the Mac app's code signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="$BUNDLE/macos/Scarlet.app"
          ls -la "$APP/Contents/MacOS"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for f in "$APP"/Contents/MacOS/*; do codesign -dv "$f" 2>&1 | grep -E "^(Identifier|Format|flags|Signature)" | sed "s|^|$(basename "$f"): |"; done
          echo "engine entitlements:"; codesign -d --entitlements - "$APP/Contents/MacOS/scarlet-engine"

      - name: Verify packaged versions and stage installers
        shell: bash
        run: node apps/desktop/scripts/verify-desktop-package.mjs "${{ matrix.triple }}" "$RELEASE_VERSION" "$RUNNER_TEMP/scarlet-installers"

      - name: Inspect public installers and smoke test their engine with external media tools
        # Git Bash delays the engine's Windows PowerShell permission checks at startup.
        run: node apps/desktop/scripts/smoke-engine-public.mjs "${{ runner.temp }}/scarlet-installers" "${{ runner.temp }}/scarlet-external-tools"

      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: scarlet-desktop-${{ matrix.triple }}
          path: ${{ runner.temp }}/scarlet-installers/
          if-no-files-found: error
          overwrite: true
