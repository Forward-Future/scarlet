name: Build desktop installers

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    if: ${{ !inputs.release || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected) }}
    environment: ${{ inputs.release && 'release' || 'desktop-build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            triple: aarch64-apple-darwin
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            triple: x86_64-apple-darwin
            arch: x86_64
    env:
      BUNDLE: apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release permissions
        if: runner.os == 'macOS'
        run: ruby .github/tests/desktop_permissions_test.rb

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.triple }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages and desktop renderer
        run: pnpm -r build

      - name: Verify Windows library permissions
        if: runner.os == 'Windows'
        run: pnpm --filter @scarlet/server exec vitest run src/services/storagePrivacy.test.ts

      # Node SEA embeds the running node binary, so this runs on the target's architecture.
      - name: Build the engine sidecar (Node SEA)
        shell: bash
        run: |
          set -euo pipefail
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          pnpm --filter @scarlet/server build:sea -- --out "$PWD/apps/desktop/src-tauri/binaries/scarlet-engine-${{ matrix.triple }}$EXT"

      - name: Fetch ffmpeg/ffprobe (pinned, checksum-verified)
        run: node apps/desktop/scripts/fetch-ffmpeg.mjs --target ${{ matrix.triple }}

      # Windows also gets a Vulkan whisper-cli for the GPU, built against the SDK's headers, loader and glslc.
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Build bundled whisper.cpp runtime
        run: node apps/desktop/scripts/build-whisper.mjs

      # Windows only: sherpa-onnx built against ONNX Runtime DirectML for speaker analysis on the GPU.
      - name: Build the GPU speaker runtime
        run: node apps/desktop/scripts/build-speaker-gpu.mjs

      - name: Check binary architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for f in apps/desktop/src-tauri/binaries/*-${{ matrix.triple }}; do
            archs=$(lipo -archs "$f"); echo "$f: $archs"
            [[ " $archs " == *" ${{ matrix.arch }} "* ]] || { echo "::error::$f is $archs, expected ${{ matrix.arch }}"; exit 1; }
          done

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --target ${{ matrix.triple }}

      - name: Test local main updater
        if: runner.os == 'macOS'
        run: python3 -B apps/desktop/scripts/test_update_macos.py

      - name: Test engine smoke script
        if: runner.os == 'macOS'
        run: node --test apps/desktop/scripts/smoke-engine.test.mjs

      # Without these secrets the Mac app is signed ad hoc: it runs, but macOS asks
      # before the first launch. Store them only in the protected release environment for a signed,
      # notarized build. Only the ones that are set are passed on, because
      # Tauri treats an empty one as set.
      - name: Apple signing secrets
        if: inputs.release && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<__SCARLET_EOF__"; echo "${!v}"; echo "__SCARLET_EOF__"; } >> "$GITHUB_ENV"; echo "$v: set"; fi
          done

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.triple }}
          tagName: ${{ inputs.release && github.ref_name || '' }}
          releaseName: ${{ inputs.release && format('Scarlet {0}', github.ref_name) || '' }}
          releaseBody: "Scarlet desktop installers. See the assets below."
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false

      - name: Check the Mac app's code signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="$BUNDLE/macos/Scarlet Early Access.app"
          ls -la "$APP/Contents/MacOS"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for f in "$APP"/Contents/MacOS/*; do codesign -dv "$f" 2>&1 | grep -E "^(Identifier|Format|flags|Signature)" | sed "s|^|$(basename "$f"): |"; done
          echo "engine entitlements:"; codesign -d --entitlements - "$APP/Contents/MacOS/scarlet-engine"

      - name: Smoke test the bundled engine (ingest, render with captions, MCP)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            DIR="$BUNDLE/macos/Scarlet Early Access.app/Contents/MacOS"
          else
            DIR="apps/desktop/src-tauri/target/${{ matrix.triple }}/release"
          fi
          MEDIA_TOOLS="$RUNNER_TEMP/scarlet-media-tools"
          mkdir -p "$MEDIA_TOOLS"
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          for tool in ffmpeg ffprobe; do
            cp "apps/desktop/src-tauri/binaries/$tool-${{ matrix.triple }}$EXT" "$MEDIA_TOOLS/$tool$EXT"
          done
          node apps/desktop/scripts/smoke-engine.mjs "$DIR" "$MEDIA_TOOLS"

      - name: Upload artifacts
        if: ${{ always() && !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: scarlet-desktop-${{ matrix.triple }}
          if-no-files-found: warn
          path: |
            ${{ env.BUNDLE }}/msi/*.msi
            ${{ env.BUNDLE }}/nsis/*.exe
            ${{ env.BUNDLE }}/dmg/*.dmg
